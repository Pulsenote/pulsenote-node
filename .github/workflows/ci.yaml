name: CI
permissions:
  contents: read
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    # Self-hosted arm64 ARC runners on k3s. The SDK is pure JS with no native
    # dependencies, so the architecture is irrelevant here — unlike the docker
    # builds in Pulsenote/pulsenote, which stay on GitHub-hosted amd64.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json engines; 24 is current LTS.
        # Node 20 went end-of-life in April 2026, so it is no longer supported.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    # Guards the published artifact: the tarball must expose working ESM and
    # CommonJS entry points, which `npm test` alone does not prove.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # RUNNER_TEMP is per-job; a bare /tmp would let a tarball from an earlier
      # run survive on a recycled self-hosted runner and get installed instead.
      # The filename is derived rather than globbed, for the same reason.
      - name: Install the packed tarball into a scratch project
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/pulsenote-$version.tgz"
          rm -rf "$tarball" "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$tarball"

      - name: Import as ESM
        run: node -e "import('pulsenote').then(m => { if (typeof m.Pulsenote !== 'function') process.exit(1) })"
        working-directory: ${{ runner.temp }}/consumer

      - name: Require as CommonJS
        run: node -e "if (typeof require('pulsenote').Pulsenote !== 'function') process.exit(1)"
        working-directory: ${{ runner.temp }}/consumer
