name: Publish

# Triggered by release-please (see release-please.yaml), dispatched at the tag it
# just created. The `release: published` trigger was deliberately REMOVED: a
# Release created with GITHUB_TOKEN emits no such event, so it never fired for an
# automated release — and keeping both triggers would double-publish once a PAT
# is configured. Dispatch is now the single path; run it by hand against a tag to
# re-publish.
"on":
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no long-lived NPM_TOKEN needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publishing a version that does not match the release tag produces an npm
      # release nobody can trace back to a commit — catch it before it happens.
      # Publishing a version that does not match the ref produces an npm release
      # nobody can trace back to a commit. Only meaningful when dispatched at a
      # version tag; a deliberate run against a branch skips it.
      - name: Check package.json matches the release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Ref $GITHUB_REF_NAME is not a version tag — skipping the match check."
            exit 0
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Ref $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Auth is GitHub OIDC (npm Trusted Publishing) — NO token. Configure it once
      # on npmjs.com: the package's Settings → Trusted Publisher → GitHub Actions,
      # org/repo Pulsenote/pulsenote-node, workflow file sdk_publish.yaml.
      # npm attaches build provenance automatically (repo must be public for that).
      - run: npm publish --access public
