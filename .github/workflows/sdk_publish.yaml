name: Publish
"on":
  release:
    types: [published]
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no long-lived NPM_TOKEN needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publishing a version that does not match the release tag produces an npm
      # release nobody can trace back to a commit — catch it before it happens.
      - name: Check package.json matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Auth is GitHub OIDC (npm Trusted Publishing) — NO token. Configure it once
      # on npmjs.com: the package's Settings → Trusted Publisher → GitHub Actions,
      # org/repo Pulsenote/pulsenote-node, workflow file sdk_publish.yaml.
      # npm attaches build provenance automatically (repo must be public for that).
      - run: npm publish --access public
